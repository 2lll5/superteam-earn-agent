name: Register Superteam agent safely (one time)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: register-superteam-agent
  cancel-in-progress: false

jobs:
  register:
    if: github.actor == 'ilbotscomodo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch audited code
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption dependency
        run: python -m pip install 'PyNaCl==1.5.0'
      - name: Register and save API credentials to GitHub Secrets
        env:
          GH_BOOTSTRAP_PAT: ${{ secrets.GH_BOOTSTRAP_PAT }}
        run: python bootstrap/register.py
